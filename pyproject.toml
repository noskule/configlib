[project]
name = "configlib"
version = "0.1.0"
description = "Runtime-configurable JSON config manager with fallback, path resolution, and backup."
authors = [
    { name = "Your Name", email = "you@example.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"

# optional dependencies for future extension
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
